name: Build mods (Windows)

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - builds

permissions:
  contents: write
  actions: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        mod: [frame-window-counter, auto-deco]

    name: ${{ matrix.mod }}
    runs-on: windows-2022 # windows-latest now ships an STL that needs Clang 22

    steps:
      - uses: actions/checkout@v4

      - name: Build
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ${{ matrix.mod }}
          sdk: given

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}
          path: ${{ steps.build.outputs.build-output }}/*.geode

  # Also commit the .geode files to the "builds" branch, so they can be
  # downloaded with plain git (and straight from the repo page).
  publish:
    name: Publish to builds branch
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Push
        run: |
          cd out
          ls -la
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'Built from %s\n' "${{ github.sha }}" > BUILT_FROM.txt
          git add -A
          git commit -q -m "Windows builds from ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds

  # If a build fails, publish the job logs to the "logs" branch.
  logs:
    name: Publish failure logs
    runs-on: ubuntu-latest
    needs: [build]
    if: failure()

    steps:
      - name: Push logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out && cd out
          api="https://api.github.com/repos/${{ github.repository }}"
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" "$api/actions/runs/${{ github.run_id }}/jobs?per_page=50" > jobs.json
          for id in $(jq -r '.jobs[] | select(.conclusion == "failure") | .id' jobs.json); do
            curl -sSL -H "Authorization: Bearer $GH_TOKEN" "$api/actions/jobs/$id/logs" -o "job-$id.log"
            grep -n -i -E "error|fatal|warning C" "job-$id.log" | head -300 > "job-$id.errors.txt" || true
          done
          printf 'Logs from run %s (%s)\n' "${{ github.run_id }}" "${{ github.sha }}" > README.txt
          git init -q -b logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Failure logs for ${{ github.sha }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" logs
